# 备案用官网（80 端口）
# 安装到服务器：
#   sudo cp ~/New_option/beian-site/nginx-afterview.conf /etc/nginx/sites-available/afterview
#   sudo ln -sf /etc/nginx/sites-available/afterview /etc/nginx/sites-enabled/afterview
#   sudo nginx -t && sudo systemctl reload nginx
#
# 提取工具仍在 :8787，不经过本配置。

server {
    listen 80;
    listen [::]:80;
    server_name afterview.cn www.afterview.cn;

    root /home/ubuntu/New_option/beian-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
