# 主站 afterview.cn：笔记页
# 分店 lab.afterview.cn：反代到本机提取工具 8787
#
# 这份文件只负责 HTTP。HTTPS 不要手写，在服务器上用 Certbot 自动改现网配置：
#   sudo apt update
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx --non-interactive --agree-tos --redirect \
#     --email afterview@163.com -d afterview.cn -d www.afterview.cn
#   sudo certbot --nginx --non-interactive --agree-tos --redirect \
#     --email afterview@163.com -d lab.afterview.cn
#
# 证书装好后，不要再把这份文件覆盖到 /etc/nginx/sites-available/afterview，
# 否则会把 443 和证书配置冲掉。

server {
    listen 80;
    listen [::]:80;
    server_name afterview.cn www.afterview.cn;

    root /home/ubuntu/New_option/beian-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name lab.afterview.cn;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
