<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="小赵学姐的黑科技 - 视频口播稿 / 公众号文章提取与 AI 总结">
  <title>小赵学姐的黑科技</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="page">
    <header class="topbar topbar--home">
      <div class="topbar__spacer"></div>
      <nav class="topbar__nav">
        <a class="topbar__link" href="/history.html">历史记录</a>
        <a id="admin-link" class="topbar__link" href="/admin.html" hidden>管理后台</a>
        <button id="logout-btn" class="topbar__button" type="button">退出</button>
      </nav>
    </header>

    <header class="hero">
      <img src="pic3.png" alt="小赵学姐的黑科技" class="hero__logo">
      <h1 class="hero__title">小赵学姐的黑科技</h1>
      <p class="hero__subtitle">粘贴分享内容，提取正文 / 口播稿并生成智能总结</p>
    </header>

    <section class="card input-card">
      <div class="input-stack">
        <textarea id="share-input" class="textarea" rows="5"
          placeholder="粘贴抖音 / B站 / 小红书 / 微信公众号链接；视频暂支持 30 分钟以内"></textarea>
        <div id="clipboard-slot" class="clipboard-slot">
          <div class="clipboard-slot__inner">
            <div id="clipboard-prompt" class="clipboard-prompt" role="status">
              <div class="clipboard-prompt__main">
                <span class="clipboard-prompt__icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M8 6.5H7.2A2.2 2.2 0 0 0 5 8.7v10.1A2.2 2.2 0 0 0 7.2 21h7.6a2.2 2.2 0 0 0 2.2-2.2V18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <rect x="9" y="3" width="10" height="14" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
                  </svg>
                </span>
                <div class="clipboard-prompt__body">
                  <p class="clipboard-prompt__title">检测到可提取链接</p>
                  <p class="clipboard-prompt__hint">可一键填入上方输入框</p>
                </div>
              </div>
              <div class="clipboard-prompt__actions">
                <button id="clipboard-paste-btn" class="btn btn--primary btn--small" type="button">粘贴</button>
                <button id="clipboard-dismiss-btn" class="clipboard-prompt__dismiss" type="button">忽略</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button id="extract-btn" class="btn btn--primary" type="button">开始提取</button>
    </section>

    <div id="status" class="status" hidden></div>

  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
