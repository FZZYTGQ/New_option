<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小赵学姐的黑科技，敬请期待">
  <title>小赵学姐的黑科技，敬请期待</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 3vw, 20px);
      width: 100%;
      max-width: 420px;
      padding: clamp(16px, 5vw, 32px);
      text-align: center;
    }

    img {
      display: block;
      width: min(240px, 55vw);
      height: auto;
    }

    p {
      color: #666666;
      font-size: clamp(13px, 3.2vw, 16px);
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <img src="pic2.png" alt="小赵学姐的黑科技">
    <p>小赵学姐的黑科技，敬请期待</p>
  </main>
</body>
</html>
